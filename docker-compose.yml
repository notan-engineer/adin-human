# Self-hosted deployment for The Heuman Chef.
#
#   docker compose up -d --build
#
# Secrets come from `.env.local` (git-ignored) - never from the image. Note that
# NEXT_PUBLIC_SITE_URL is ALSO a build arg: `NEXT_PUBLIC_*` values are inlined
# into the client bundle at build time, so setting it only in `environment`
# would leave the browser bundle pointing at localhost.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:4000}
    image: heuman-chef:latest
    container_name: heuman-chef
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      # Public base URL. Used for canonicals, OG images, and - critically - the
      # absolute redirect/callback URLs the payment flow builds via getSiteUrl().
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:4000}

      # Provider selection (see lib/commerce/registry.ts).
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-yeshinvoice}
      DELIVERY_PROVIDER: ${DELIVERY_PROVIDER:-stub}
      INVOICE_PROVIDER: ${INVOICE_PROVIDER:-stub}
      ORDER_REPOSITORY: ${ORDER_REPOSITORY:-memory}

      # YeshInvoice. With SECRET/USERKEY unset the adapter runs in stub mode and
      # completes payments offline - fine for a demo, NOT for production.
      YESHINVOICE_SECRET: ${YESHINVOICE_SECRET:-}
      YESHINVOICE_USERKEY: ${YESHINVOICE_USERKEY:-}
      YESHINVOICE_CURRENCY_ID_ILS: ${YESHINVOICE_CURRENCY_ID_ILS:-1}
      YESHINVOICE_DOCUMENT_TYPE: ${YESHINVOICE_DOCUMENT_TYPE:-9}
      YESHINVOICE_LANG_ID_HE: ${YESHINVOICE_LANG_ID_HE:-359}
      YESHINVOICE_LANG_ID_EN: ${YESHINVOICE_LANG_ID_EN:-139}

      NEXT_PUBLIC_VAT_RATE: ${NEXT_PUBLIC_VAT_RATE:-0.18}
    env_file:
      # Optional: everything above can instead live here. Missing file is fatal
      # to `docker compose up`, so keep a `.env.local` (copy `.env.example`).
      - path: .env.local
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
